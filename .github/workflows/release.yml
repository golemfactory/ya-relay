name: Release

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Clean build (${{ matrix.replica }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    env:
      CARGO_HOME: ${{ runner.temp }}/cargo
      RUSTUP_HOME: ${{ runner.temp }}/rustup
      CARGO_TARGET_DIR: ${{ runner.temp }}/target
      CARGO_INCREMENTAL: '0'
      PROTOC: /usr/bin/protoc
      OPENSSL_STATIC: '1'
      YA_RELAY_BUILD_NUMBER: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check release source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            git merge-base --is-ancestor HEAD origin/main
            VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1)
            test "$REF_NAME" = "v$VERSION"
          fi
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "YA_RELAY_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "YA_RELAY_BUILD_DATE=$(git show -s --format=%cs HEAD)" >> "$GITHUB_ENV"

      - name: Install tools in fresh directories
        run: |
          set -euo pipefail
          test ! -e "$CARGO_HOME"
          test ! -e "$RUSTUP_HOME"
          test ! -e "$CARGO_TARGET_DIR"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools cmake protobuf-compiler
          rustup toolchain install 1.97.0 --profile minimal --target x86_64-unknown-linux-musl
          echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/src --remap-path-prefix=$RUNNER_TEMP=/build" >> "$GITHUB_ENV"

      - name: Fetch locked dependencies
        run: cargo +1.97.0 fetch --locked --target x86_64-unknown-linux-musl

      - name: Build without dependency resolution or downloads
        run: cargo +1.97.0 build --frozen --release --target x86_64-unknown-linux-musl -p ya-relay-server

      - name: Package and smoke test
        run: bash scripts/ci/package-release.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.replica }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Release reproducibility
    if: always()
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Require both builds to succeed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: replicas
      - name: Require identical independently built binaries and packages
        run: |
          set -euo pipefail
          (cd replicas/release-1 && sha256sum --check SHA256SUMS)
          (cd replicas/release-2 && sha256sum --check SHA256SUMS)
          cmp replicas/release-1/ya-relay-server replicas/release-2/ya-relay-server
          cmp replicas/release-1/*.deb replicas/release-2/*.deb
          cmp replicas/release-1/Cargo.lock replicas/release-2/Cargo.lock
          cp -a replicas/release-1 dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest verified release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verified-release
          path: dist
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: dist/SHA256SUMS

  publish:
    name: Publish immutable release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, attest]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verified-release
          path: dist
      - name: Publish once, after all assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "ya-relay-server ${RELEASE_TAG#v}" --notes-file RELEASE-NOTES.md
          gh release upload "$RELEASE_TAG" ya-relay-server ./*.deb Cargo.lock BUILD-INFO.json SHA256SUMS RELEASE-NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
